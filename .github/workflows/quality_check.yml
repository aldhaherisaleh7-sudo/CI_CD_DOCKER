name: Code Quality
on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  QA:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      
      - name: spin container
        run: docker compose -f docker-compose.ci.yml up -d
        env:
          DB_CONNECTION: ${{ secrets.QA_DB_CONNECTION }}
          DB_HOST: ${{ secrets.QA_DB_HOST }}
          DB_PORT: ${{ secrets.QA_DB_PORT }}
          DB_DATABASE: ${{ secrets.QA_DB_DATABASE }}
          DB_USERNAME_ROOT: ${{ secrets.QA_DB_USERNAME_ROOT }} 
          DB_PASSWORD_ROOT: ${{ secrets.QA_DB_PASSWORD_ROOT }} 

      - name: copy env
        run: cp .env.example .env
        
      - name: generate app key
        run:  docker exec application php artisan key:generate
        
      - name: install dev dependencies
        run:  docker exec application composer install

      - name: install and enable xdebug
        run: |
          docker exec application pecl install xdebug
          docker exec application docker-php-ext-enable xdebug
        
      - name: run tests and coverage
        run: docker exec -e XDEBUG_MODE=coverage application php artisan test --parallel --coverage

      - name: run static analysis
        run:  docker exec application ./vendor/bin/phpstan analyse -l 6 app
