services:
  app:
    container_name: application
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - /var/www/.env
    networks:
      - app-network

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - /var/www/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
