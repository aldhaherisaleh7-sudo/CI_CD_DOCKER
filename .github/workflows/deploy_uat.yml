name: UAT
on:
  issue_comment:
    types: [created]

jobs:
  build-and-push:
    if: contains(github.event.comment.body, 'deploy uat') && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: get PR branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('branch', pr.data.head.ref);

      - name: checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.UAT_DOCKER_USERNAME }}
          password: ${{ secrets.UAT_DOCKER_TOKEN }}

      - name: build and push image
        run: |
          docker build \
            -t ${{ secrets.UAT_DOCKER_USERNAME }}/application:uat \
            -t ${{ secrets.UAT_DOCKER_USERNAME }}/application:${{ steps.pr.outputs.sha }} \
            .
          docker push ${{ secrets.UAT_DOCKER_USERNAME }}/application:uat
          docker push ${{ secrets.UAT_DOCKER_USERNAME }}/application:${{ steps.pr.outputs.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1.0.3
        with: 
            host: ${{ secrets.UAT_EC2_HOST }}
            username: ${{ secrets.UAT_EC2_USERNAME }}
            key: ${{ secrets.UAT_EC2_SSH_KEY }}
            script: |
              cd /var/www/application
              docker compose pull
              docker compose up -d
              sleep 300
              docker compose ps
              if [ "$(docker compose ps --status running | grep -c 'running')" -lt 3 ]; then
                echo "❌ Not all containers are running!"
                docker compose logs --tail=50
                exit 1
              fi
              echo "✅ All containers are up and running (3.107.49.19)" 
                    
