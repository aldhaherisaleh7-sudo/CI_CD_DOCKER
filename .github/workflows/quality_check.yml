name: Code Quality

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
  push:
    branches:
      - main
  
jobs:
  Testing:
      runs-on: ubuntu-latest

      steps:
        - name: checkout
          uses: actions/checkout@v4

        - name: make env file
          run: cp .env.example .env.testing

        - name: spin container
          run: docker compose up -d 

        - name: generate app key
          run: docker exec application php artisan key:generate
          
        - name: run test
          run: docker exec application  php artisan test --env=testing

        - name: run covarge check
          run:  docker exec application  php artisan test --coverage --env=testing
     
